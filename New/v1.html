<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athlética</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .phone-container {
            width: 375px;
            height: 812px;
            background: #f5f5f5;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        inset 0 0 0 8px #2c2c2c,
                        inset 0 0 0 12px #1a1a1a;
            position: relative;
        }

        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #1a1a1a;
            border-radius: 0 0 20px 20px;
            z-index: 100;
        }

        .header {
            background: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #2196F3;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            color: #2196F3;
        }

        .header-icons {
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #666;
            cursor: pointer;
            padding: 5px;
        }

        .main-content {
            padding: 20px;
            background: #f5f5f5;
        }

        .workout-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .workout-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            display: block;
        }

        .workout-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .workout-info h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .workout-info p {
            font-size: 28px;
            font-weight: 300;
        }

        .action-buttons {
            display: flex;
            justify-content: space-around;
            padding: 0 10px;
            margin-bottom: 30px;
        }

        .action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 28px;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .btn-reload {
            background: #FFC107;
            color: white;
        }

        .btn-close {
            background: #424242;
            color: white;
        }

        .btn-star {
            background: #2196F3;
            color: white;
        }

        .btn-heart {
            background: #4CAF50;
            color: white;
        }

        .btn-bolt {
            background: #9C27B0;
            color: white;
        }

        .bottom-nav {
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #e0e0e0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: #999;
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #2196F3;
        }

        .nav-icon {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm-3.6 13.9l1-4.4 2.1 2v6h2v-7.5l-2.1-2 .6-3c1.3 1.5 3.3 2.5 5.5 2.5v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1l-5.2 2.2v4.7h2v-3.4l1.8-.7-1.6 8.1-4.9-1-.4 2 7 1.4z"/>
                </svg>
                <span>Athlética</span>
            </div>
            <div class="header-icons">
                <button class="icon-btn">🔔</button>
                <button class="icon-btn">☰</button>
            </div>
        </div>

        <div class="main-content">
            <div class="workout-card">
                <img src="https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=800&h=1000&fit=crop" alt="Squat workout" class="workout-image">
                <div class="workout-info">
                    <h2>Squat série 1/3</h2>
                    <p>rep 20</p>
                </div>
            </div>

            <div class="action-buttons">
                <button class="action-btn btn-reload">↻</button>
                <button class="action-btn btn-close">✕</button>
                <button class="action-btn btn-star">★</button>
                <button class="action-btn btn-heart">♥</button>
                <button class="action-btn btn-bolt">⚡</button>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <span class="nav-icon">🔍</span>
                <span>Discover</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">▦</span>
                <span>Feed</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">☆</span>
                <span>Top Picks</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">💬</span>
                <span>Messages</span>
            </a>
        </nav>
    </div>
</body>
</html>
